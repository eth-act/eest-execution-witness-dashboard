name: Rerun failed dashboard refresh jobs

# Infrastructure flakes, such as a stalled artifact download, fail the whole
# refresh because publish needs every workload. Test failures don't fail jobs,
# so a failed job is an infrastructure problem. Rerun the failed jobs once, and
# leave a second failure for someone to look at.
on:
  workflow_run:
    workflows: [Refresh execution witness dashboard]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    name: Rerun failed jobs
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rerun failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -Eeuo pipefail
          gh run rerun "$RUN_ID" --failed
          echo "Reran the failed jobs of $RUN_URL" >> "$GITHUB_STEP_SUMMARY"
